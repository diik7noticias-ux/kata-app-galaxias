[build-system]
requires = ["briefcase>=0.3.20"]
build-backend = "briefcase.build"

[project]
name = "galaxias"
version = "0.1.0"
description = "Galaxias"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[tool.briefcase]
project_name = "Galaxias"
formal_name = "Galaxias"
app_name = "galaxias"
bundle = "org.kata.galaxias"
version = "0.1.0"
description = "Galaxias"

[tool.briefcase.app.galaxias]
formal_name = "Galaxias"
description = "Galaxias"
sources = ["src/galaxias"]
requires = ["toga-android"]

[tool.briefcase.app.galaxias.android]
requires = ["toga-android"]
