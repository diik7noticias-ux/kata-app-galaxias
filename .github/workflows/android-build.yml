name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Briefcase + Toga
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install briefcase toga-android

      - name: Configurar JAVA_HOME
        run: |
          echo "JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME_17_arm64}" | tee -a $GITHUB_ENV

      - name: Aceitar licencas Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Briefcase build android
        run: briefcase build android --no-input

      - name: Encontrar APK
        id: find_apk
        run: |
          APK=$(find . -name '*.apk' -type f | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Criar Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
